openapi: 3.0.3
info:
  title: MDUC247 Promotion API
  version: 2.0.0
  description: Seller and platform campaigns. A checkout may use one seller voucher and one platform voucher; Catalog/Flash price, seller voucher, then platform voucher are applied in that order.
servers:
  - url: http://localhost:5105/api/v2
paths:
  /promotions/active:
    get:
      summary: Active public voucher campaigns
      responses:
        '200':
          description: Server time and public campaigns with remaining usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverTime: { type: string, format: date-time }
                  promotions:
                    type: array
                    items:
                      type: object
                      properties:
                        campaign: { $ref: '#/components/schemas/Campaign' }
                        voucher: { $ref: '#/components/schemas/Voucher' }
  /flash-sales:
    get:
      summary: Active Flash Sale SKU prices and quotas
      responses:
        '200':
          description: Server time and sellable Flash Sale items
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverTime: { type: string, format: date-time }
                  items: { type: array, items: { $ref: '#/components/schemas/FlashItem' } }
  /promotions/vouchers/validate:
    post:
      security: [{ buyerBearer: [] }]
      summary: Validate voucher against the authenticated buyer's server-side selected cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 4, maxLength: 32 }
      responses:
        '200': { description: Eligible discount and deterministic allocation per selected SKU }
        '404': { description: VOUCHER_NOT_FOUND }
        '409': { description: VOUCHER_EXPIRED, VOUCHER_NOT_STARTED, VOUCHER_MIN_SPEND, VOUCHER_SCOPE_MISMATCH, VOUCHER_QUOTA_EXHAUSTED, VOUCHER_USER_LIMIT or USER_SEGMENT_MISMATCH }
  /internal/promotions/quote:
    post:
      security: [{ orderInternal: [] }]
      summary: Calculate Flash Sale and up to one store plus one platform voucher from trusted Catalog lines
      responses:
        '200': { description: Server timestamp, per-line discount sources and vouchers }
  /internal/promotions/platform-vouchers:
    post:
      security: [{ promotionAdmin: [] }]
      summary: Create a platform-funded voucher (internal administrator operation)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlatformVoucher' }
      responses:
        '201': { description: Created platform voucher }
        '403': { description: Separate promotion admin token required }
  /internal/promotions/stores/{storeId}/vouchers:
    post:
      security: [{ promotionAdmin: [] }]
      summary: Create a seller-funded store voucher as an internal administrator
      parameters:
        - { in: path, name: storeId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVoucher' }
      responses:
        '201': { description: Created store voucher }
        '403': { description: Separate promotion admin token required }
  /internal/promotions/reserve:
    post:
      security: [{ orderInternal: [] }]
      summary: Atomically reserve voucher use and Flash Sale quota by order reference
      responses:
        '201': { description: Reservation with idempotent flag }
        '409': { description: Quota or eligibility changed }
  /internal/promotions/commit:
    post:
      security: [{ orderInternal: [] }]
      summary: Commit reserved use and attach shop order IDs after checkout persistence
      responses:
        '200': { description: Committed or idempotent retry }
  /internal/promotions/release:
    post:
      security: [{ orderInternal: [] }]
      summary: Release a pending checkout reservation
      responses:
        '200': { description: Released, expired or idempotent retry }
  /internal/promotions/release-shop:
    post:
      security: [{ orderInternal: [] }]
      summary: Restore committed quota for one cancelled shop order exactly once
      responses:
        '200': { description: Number of usages released }
  /internal/promotions/release-platform:
    post:
      security: [{ orderInternal: [] }]
      summary: Restore platform voucher quota when every shop order in the group is cancelled
      responses:
        '200': { description: Number of platform usages released; retry is idempotent }
  /internal/promotions/reconcile:
    post:
      security: [{ orderInternal: [] }]
      summary: Sweep expired reservations, ended campaigns and cancelled order usages
      responses:
        '200': { description: Expired, ended, checked and released counts }
  /seller/stores/{storeId}/vouchers:
    get:
      security: [{ sellerBearer: [] }]
      summary: Campaigns for an active member of the store
      parameters:
        - { in: path, name: storeId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Store campaigns }
        '403': { description: Store membership required }
    post:
      security: [{ sellerBearer: [] }]
      summary: Create a seller-funded fixed or basis-point percent voucher
      parameters:
        - { in: path, name: storeId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVoucher' }
      responses:
        '201': { description: Created voucher }
        '403': { description: Store membership required }
        '409': { description: VOUCHER_CODE_EXISTS }
  /seller/stores/{storeId}/flash-sales:
    post:
      security: [{ sellerBearer: [] }]
      summary: Create a seller-funded Flash Sale with SKU quotas
      parameters:
        - { in: path, name: storeId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFlashSale' }
      responses:
        '201': { description: Created Flash Sale }
        '409': { description: FLASH_SALE_OVERLAP }
  /seller/campaigns/{id}/status:
    patch:
      security: [{ sellerBearer: [] }]
      summary: Pause, resume or end only a campaign in the seller's store
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Updated campaign }
        '403': { description: Store membership required }
components:
  securitySchemes:
    buyerBearer: { type: http, scheme: bearer, bearerFormat: JWT }
    sellerBearer: { type: http, scheme: bearer, bearerFormat: JWT }
    orderInternal: { type: apiKey, in: header, name: X-Promotion-Token }
    promotionAdmin: { type: apiKey, in: header, name: X-Promotion-Admin-Token }
  schemas:
    Campaign:
      type: object
      required: [id, type, status, fundingSource, title, startsAt, endsAt]
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid, nullable: true }
        type: { type: string, enum: [VOUCHER, FLASH_SALE] }
        status: { type: string, enum: [DRAFT, ACTIVE, PAUSED, ENDED] }
        fundingSource: { type: string, enum: [SELLER, PLATFORM] }
        title: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    Voucher:
      type: object
      required: [id, code, discountType, discountValue, minSpendMinor, totalLimit, perUserLimit, usedCount, reservedCount, scopeType, segment]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        discountType: { type: string, enum: [FIXED, PERCENT] }
        discountValue: { type: integer, description: VND for FIXED; basis points for PERCENT }
        maxDiscountMinor: { type: integer, nullable: true }
        minSpendMinor: { type: integer }
        totalLimit: { type: integer }
        perUserLimit: { type: integer }
        usedCount: { type: integer }
        reservedCount: { type: integer }
        scopeType: { type: string, enum: [STORE, CATEGORY, SKU, PLATFORM] }
        scopeId: { type: string, format: uuid, nullable: true }
        segment: { type: string, enum: [ALL, FIRST_ORDER] }
        stackable: { type: boolean, enum: [false], description: Cross-kind store plus platform stacking is allowed by checkout policy; same-kind stacking remains disallowed }
    FlashItem:
      type: object
      required: [campaignId, variantId, salePriceMinor, quota, soldCount, reservedCount, startsAt, endsAt]
      properties:
        campaignId: { type: string, format: uuid }
        variantId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string }
        imageUrl: { type: string, nullable: true }
        salePriceMinor: { type: integer }
        regularPriceMinor: { type: integer }
        availableStock: { type: integer, minimum: 0 }
        quota: { type: integer }
        soldCount: { type: integer }
        reservedCount: { type: integer }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    CreateVoucher:
      type: object
      required: [title, code, discountType, discountValue, totalLimit, startsAt, endsAt]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        code: { type: string, minLength: 4, maxLength: 32 }
        discountType: { type: string, enum: [FIXED, PERCENT] }
        discountValue: { type: integer, minimum: 1 }
        maxDiscountMinor: { type: integer, minimum: 0, nullable: true }
        minSpendMinor: { type: integer, minimum: 0 }
        totalLimit: { type: integer, minimum: 1 }
        perUserLimit: { type: integer, minimum: 1 }
        scopeType: { type: string, enum: [STORE, CATEGORY, SKU] }
        scopeId: { type: string, format: uuid, nullable: true }
        segment: { type: string, enum: [ALL, FIRST_ORDER] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    CreatePlatformVoucher:
      type: object
      required: [title, code, discountType, discountValue, totalLimit, startsAt, endsAt]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        code: { type: string, minLength: 4, maxLength: 32 }
        discountType: { type: string, enum: [FIXED, PERCENT] }
        discountValue: { type: integer, minimum: 1, description: VND for FIXED; basis points for PERCENT }
        maxDiscountMinor: { type: integer, minimum: 0, nullable: true }
        minSpendMinor: { type: integer, minimum: 0 }
        totalLimit: { type: integer, minimum: 1 }
        perUserLimit: { type: integer, minimum: 1 }
        segment: { type: string, enum: [ALL, FIRST_ORDER] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    CreateFlashSale:
      type: object
      required: [title, startsAt, endsAt, items]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [variantId, salePriceMinor, quota]
            properties:
              variantId: { type: string, format: uuid }
              salePriceMinor: { type: integer, minimum: 1 }
              quota: { type: integer, minimum: 1 }
